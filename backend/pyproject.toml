[tool.poetry]
name = "prompt-eng-lms-backend"
version = "0.1.0"
description = "Prompt Engineering Learning Platform Backend"
authors = ["Devin AI"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {version = "^0.115.0", extras = ["standard"]}
uvicorn = {version = "^0.24.0", extras = ["standard"]}
sqlalchemy = "^2.0.23"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
bcrypt = "^4.0.1"
python-multipart = "^0.0.18"
pydantic = {version = "^2.5.2", extras = ["email-validator"]}
email-validator = "^2.1.0"
pydantic-settings = "^2.1.0"
openai = "^1.6.1"
alembic = "^1.13.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.2"
aiosqlite = "^0.19.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
